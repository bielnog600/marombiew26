<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
     <meta name="screen-orientation" content="portrait">
     <meta name="x5-orientation" content="portrait">
    <title>MAROMBIEW</title>
    <meta name="description" content="Treino e dieta personalizada">
    <meta name="author" content="MAROMBIEW" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0F1115" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MAROMBIEW" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Preload splash logo so it appears instantly, even offline (cached by SW) -->
    <link rel="preload" as="image" href="/splash-logo.webp" type="image/webp" fetchpriority="high" />

    <!-- Inline critical styles: prevents white flash before CSS/JS load on slow connections -->
    <style>
      html, body { background-color: #0F1115 !important; margin: 0; padding: 0; overscroll-behavior: none !important; }
      html { color-scheme: dark; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column;
        background-color: #0F1115;
        opacity: 1;
        transform: translateZ(0);
        backface-visibility: hidden;
      }
      #boot-splash .boot-logo-wrap {
        position: relative;
        width: 170px; height: 170px;
        opacity: 0;
        transform: scale(0.96) translateZ(0);
        animation: boot-enter 280ms ease-out forwards;
        transform-origin: center;
      }
      #boot-splash svg {
        position: absolute; inset: 0;
        animation: boot-spin 1.2s linear infinite;
      }
      #boot-splash img {
        position: absolute; inset: 0; margin: auto;
        width: 154px; height: 154px; border-radius: 16px;
      }
      #boot-splash [data-splash-update-status] {
        position: absolute;
        left: 24px;
        right: 24px;
        top: calc(50% + 118px);
        margin: 0;
        text-align: center;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0;
        color: #FFC400;
        opacity: 0.78;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes boot-enter {
        from { opacity: 0; transform: scale(0.96) translateZ(0); }
        to { opacity: 1; transform: scale(1) translateZ(0); }
      }
      #boot-splash.boot-leaving {
        opacity: 0;
        transition: opacity 320ms ease-in;
      }
    </style>

    <!-- OG Tags -->
    
    
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/ZKFdTot101cDpik2NVU6w54XJb22/social-images/social-1772224538718-logo_marombiew.webp">
    <meta name="twitter:card" content="summary_large_image" />
    
    
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/ZKFdTot101cDpik2NVU6w54XJb22/social-images/social-1772224538718-logo_marombiew.webp">
    <meta property="og:title" content="MAROMBIEW">
  <meta name="twitter:title" content="MAROMBIEW">
  <meta property="og:description" content="Treino e dieta personalizada">
  <meta name="twitter:description" content="Treino e dieta personalizada">
</head>

  <body>
    <div id="boot-splash">
      <script>if(sessionStorage.getItem('_splashDone')){document.getElementById('boot-splash').style.display='none'}</script>
      <div class="boot-logo-wrap">
        <svg width="170" height="170" viewBox="0 0 170 170" aria-hidden="true">
          <circle cx="85" cy="85" r="83" stroke="#171A21" stroke-width="4" fill="none" opacity="0.45" />
          <circle cx="85" cy="85" r="83" stroke="#FFC400" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="130 391" />
        </svg>
        <img src="/splash-logo.webp" alt="MAROMBIEW" />
      </div>
      <p data-splash-update-status="true">Carregando...</p>
    </div>
    <div id="root"></div>
    <script>
      // Vigia do boot: se o app não montar em 6 s (parte do app antiga em cache,
      // erro no início ou rede presa), nunca deixa a tela preta. Tenta UMA
      // recuperação automática (limpa caches do app e recarrega) a cada 10 min;
      // depois disso mostra a tela "Atualizar app" com botão.
      (function () {
        var errs = [];
        window.addEventListener('error', function (e) {
          var t = e.target; errs.push(t && t.src ? 'load ' + t.src : (e.message || 'erro'));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { errs.push(String(e.reason && e.reason.message || e.reason)); });
        function standalone() { try { return !!navigator.standalone || matchMedia('(display-mode: standalone)').matches; } catch (x) { return false; } }
        function clearAndReload() {
          var tasks = [];
          try {
            if (navigator.serviceWorker) tasks.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.filter(function (r) {
                var w = r.active || r.waiting || r.installing; return w && new URL(w.scriptURL).pathname === '/sw.js';
              }).map(function (r) { return r.unregister(); }));
            }));
            if (window.caches) tasks.push(caches.keys().then(function (ks) {
              return Promise.all(ks.filter(function (k) { return /workbox|precache|runtime|pages|images|fonts|assets/i.test(k); }).map(function (k) { return caches.delete(k); }));
            }));
          } catch (x) {}
          try { sessionStorage.removeItem('_splashDone'); } catch (x) {}
          Promise.all(tasks).catch(function () {}).then(function () { location.reload(); });
        }
        window.__mwRecoverApp = clearAndReload;
        var startedAt = Date.now();
        function check() {
          if (window.__mwAppMounted) return;
          // Ainda baixando numa rede lenta, sem erro: espera mais um pouco (até 20 s).
          if (!errs.length && document.readyState !== 'complete' && Date.now() - startedAt < 20000) { setTimeout(check, 2000); return; }
          try {
            localStorage.setItem('mw_boot_failure', JSON.stringify({ at: new Date().toISOString(), route: location.pathname, standalone: standalone(), detail: errs.slice(0, 3).join(' | ').slice(0, 500) }));
          } catch (x) {}
          var last = 0;
          try { last = Number(localStorage.getItem('mw_boot_recover_at') || 0); } catch (x) {}
          if (navigator.onLine && Date.now() - last > 600000) {
            try { localStorage.setItem('mw_boot_recover_at', String(Date.now())); } catch (x) {}
            clearAndReload();
            return;
          }
          var box = document.createElement('div');
          box.id = 'boot-recovery';
          box.setAttribute('style', 'position:fixed;inset:0;z-index:100000;background:#0F1115;color:#f4f4f5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font-family:Inter,system-ui,-apple-system,sans-serif');
          box.innerHTML = '<img src="/splash-logo.webp" alt="" width="96" height="96" style="border-radius:14px"/>' +
            '<p style="margin:0;font-size:17px;font-weight:700">O app não abriu</p>' +
            '<p style="margin:0;font-size:14px;opacity:.75;max-width:300px">Seus treinos e registros estão salvos. Toque para baixar a versão mais nova.</p>' +
            '<button type="button" style="min-height:48px;padding:0 28px;border:0;border-radius:14px;background:#FFC400;color:#0F1115;font-weight:800;font-size:15px">Atualizar app</button>';
          box.querySelector('button').addEventListener('click', clearAndReload);
          document.body.appendChild(box);
        }
        setTimeout(check, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
